
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Sala</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body background="/static/cinemafundo.png">

    <h1>Editar Sala de Cinema</h1>

    <nav>
        <a href="/">
            <button>Página Inicial</button>
        </a>

        <a href="/cadastrar_sala">
            <button>Cadastro de Sala</button>
        </a>

        <a href="/cadastrar_filmes">
            <button>Cadastro de Filmes</button>
        </a>

        <a href="/exibir_salas">
            <button>Exibir Salas</button>
        </a>

        <a href="/exibir_filmes">
            <button>Exibir Filmes</button>
        </a>
    </nav>

    <br><br>

    <form action="/editar_sala/{{ sala[0] }}" method="post">

        <fieldset>
            <legend>Editar informações da sala</legend>

            <label for="nome">Nome da sala:</label>
            <input type="text" name="nome" id="nome"
                   value="{{ sala[1] }}" required>

            <br><br>

            <label for="tipo">Tipo:</label>
            <input type="text" name="tipo" id="tipo"
                   value="{{ sala[2] }}" required>

            <br><br>

            <label for="capacidade">Capacidade:</label>
            <input type="number" name="capacidade" id="capacidade"
                   value="{{ sala[3] }}" required>

            <br><br>

            <label for="preco_ingresso">Preço do ingresso:</label>
            <input type="number" name="preco_ingresso"
                   id="preco_ingresso" step="0.01"
                   value="{{ sala[4] }}" required>

            <br><br>

            <button type="submit">Salvar Alterações</button>
        </fieldset>

    </form>

</body>
</html>
