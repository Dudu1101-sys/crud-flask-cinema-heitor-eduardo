
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Filme</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body background="/static/cinemafundo.png">

    <h1>Editar Filme</h1>

    <nav>
        <a href="/">
        <button>Página inicial</button>
        </a>
        <a href="/cadastrar_filmes">
            <button>Cadastro de Filmes</button>
        </a>
        <a href="/exibir_filmes">
            <button>Exibir Filmes</button>
        </a>
        <a href="/cadastrar_sala">
            <button>Cadastro de Sala</button>
        </a>
        <a href="/exibir_salas">
            <button>Exibir Salas</button>
        </a>
    </nav>

    <br><br>

    <form action="/editar_filme/{{ filme[0] }}" method="post">

        <fieldset>
            <legend>Editar informações do filme</legend>

            <label for="titulo">Título:</label>
            <input type="text" name="titulo" id="titulo"
                   value="{{ filme[1] }}" required>

            <br><br>

            <label for="genero">Gênero:</label>
            <input type="text" name="genero" id="genero"
                   value="{{ filme[2] }}" required>

            <br><br>

            <label for="duracao_min">Duração (minutos):</label>
            <input type="number" name="duracao_min" id="duracao_min"
                   value="{{ filme[3] }}" required>

            <br><br>

            <label for="data_lancamento">Data de lançamento:</label>
            <input type="date" name="data_lancamento" id="data_lancamento"
                   value="{{ filme[4] }}" required>

            <br><br>

            <button type="submit">Salvar Alterações</button>
        </fieldset>

    </form>

</body>
</html>
